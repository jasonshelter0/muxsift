[workspace]
members = ["crates/muxsift-core", "crates/muxsift-cli", "crates/muxsift-tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
futures-util = "0.3"
indicatif = "0.18"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"
unicode-width = "0.2"
